<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        .kartu{
            background-color: white;
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }

        .foto {
            border-radius: 50%;
            width: 100px;
        }

        .pekerjaan{
            color: gray;
            margin-top: -10px;
        }

        .btn-kontak{
            background-color: lightgreen;
            color: white;
            padding: 10px 20px;
            margin-left: 20px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="kartu">
        <img src="foto.syifa.jpeg" alt="foto-syifa" class="foto" width="250">
        <h2> Alkhanza Syifa Heriyanto </h2>
        <p class="Pekerjaan"> Web Developer </p>
        <p> Siswa kelas XI RPL yang bercita-cita membuat startup teknologi di Indonesia. </p>
        <button class="btn-kontak"> Hubungi Saya! </button>
    </div>
    
</body>
</html>
