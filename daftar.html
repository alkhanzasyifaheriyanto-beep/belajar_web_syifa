<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Daftar di SMKM3 </title>
</head>
<body>
    <table>
        <form>
            <h2> DAFTAR ESKUL SMKM3 </h2>
            <tr>
                <th> Nama Lengkap </th>
                <th> : </th>
                <td><input type="text" placeholder="masukkan nama disini" required></td>
            </tr>

            <tr> 
                <th> Tanggal Lahir </th>
                <th> : </th>
                <td><input type="date" required></td>
            </tr>

            <tr>
                <th> Nomor HP/WA </th>
                <th> : </th>
                <td><input type="number" required></td>
            </tr>

            <tr>
                <td><button type="button" name="submit"> Login Sekarang </td>
            </tr>
        </form>
    </table>
    
</body>
</html>
